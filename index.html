<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Convertible Words</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Spanish Convertible Words</h1>
            <p class="subtitle">Explore and convert Spanish words</p>
        </header>
        
        <main>
            <div class="input-section">
                <input type="text" id="wordInput" placeholder="Enter a Spanish word..." />
                <button id="convertBtn">Convert</button>
            </div>
            
            <div class="results-section" id="results">
                <!-- Results will appear here -->
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
